name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/sales
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create schema
        run: |
          psql "postgresql://ci:ci@localhost:5432/sales" -f sql/ddl/01_schema.sql
          psql "postgresql://ci:ci@localhost:5432/sales" -f sql/ddl/02_indexes.sql
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest tests
